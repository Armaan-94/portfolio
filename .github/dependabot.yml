# Dependabot keeps dependencies and Actions current. It opens PRs only when a
# real update exists — no-op weeks produce nothing. Minor/patch bumps are
# grouped to keep the PR volume sane for a solo repo.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # One PR for all non-major updates; majors still come through individually
      # so you can review breaking changes deliberately.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
